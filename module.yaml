package: larena/core
title: Larena Core
status: coding_started
cluster: platform-api
batch: first-run-site-wizard-v1
features:
  - core.assets.activation_contract
  - core.assets.verified_immutable_distribution_publication
  - core.data_content_cluster_smoke
  - core.install_audit_trail_apply_guarded
  - core.install_readiness_contract
  - core.installer_db_schema_apply_guarded
  - core.installer_persistence_foundation_guarded_apply
  - core.native_command_ux
  - core.operation_runtime
  - core.operation_runtime.transaction_boundary
  - core.package_registry_db_seed_guarded
  - core.package_registry_diagnostics
  - core.package_registry_seed_guarded_apply
  - core.runtime_security_cluster_smoke
  - core.starter_cli_commands
  - core.first_run_state_machine
  - core.first_run_preflight
  - core.first_run_atomic_initialized_marker
owner_boundary:
  owns:
    - operation runtime contract boundary
    - operation descriptor/context/decision/result contracts
    - Larena starter diagnostic command ownership
    - fail-closed installer readiness contract
    - guarded package registry seed mutation contract
    - read-only package registry diagnostics
    - read-only runtime/security cluster smoke report
    - core.assets activation contract
    - verified immutable frontend bundle publication for approved runtime tracks
    - first-run state machine and initialized marker
    - sanitized first-run environment preflight
    - atomic dependency-inverted bootstrap orchestration
  consumes:
    - larena/access decisions
    - larena/licensing capability context
    - larena/audit correlation metadata
    - larena/queue execution mode handoff
  must_not_own:
    - final access enforcement
    - final audit storage
    - final licensing checks
    - queue runners
    - production operation handlers
    - physical frontend asset publication without an explicit publish/runtime track
runtime:
  php: "^8.3"
  laravel: "^13.0"
evidence:
  path: docs/project-management/evidence/canonical-assembly/
