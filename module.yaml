owner_boundary:
  owns:
    - operation runtime contract boundary
    - operation descriptor/context/decision/result contracts
    - Larena starter diagnostic command ownership
    - fail-closed installer readiness contract
    - guarded package registry seed mutation contract
    - read-only package registry diagnostics
    - read-only runtime/security cluster smoke report
    - core.assets activation contract
    - verified immutable frontend bundle publication for approved runtime tracks
    - deployment-time receipt and fail-closed verification for exact renderable asset entrypoints
    - first-run state machine and initialized marker
    - sanitized first-run environment preflight
    - atomic dependency-inverted bootstrap orchestration
    - signed ordinary-hosting web-install capability and checkpoint state
    - empty-schema MySQL preflight and atomic migration activation or rollback
    - scope model: site and organization system records and the ScopeRef contract
    - planes, nodes and membership system records with no business meaning
    - idempotent scope and plane baseline install step
    - the one transport-neutral operation registry and its declaration contract
    - the descriptor v2 policy enforced at registration
    - the stateless proposal, approval and confirmation path
    - transport resolution, the local transport and the network transport port
  consumes:
    - larena/access decisions
    - larena/licensing capability context
    - larena/audit correlation metadata
    - larena/queue execution mode handoff
  must_not_own:
    - final access enforcement
    - final audit storage
    - final licensing checks
    - queue runners
    - production operation handlers
    - physical frontend asset publication without an explicit publish/runtime track
runtime:
  php: "^8.3"
  laravel: "^13.0"
evidence:
  path: docs/project-management/evidence/minimal-cms-v1-1-batch-3-operation-registry
